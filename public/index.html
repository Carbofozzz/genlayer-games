<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" type="image/svg+xml" href="/img/mark_black-BvQhofdN.svg" media="(prefers-color-scheme: light)"/>
    <link rel="shortcut icon" type="image/svg+xml" href="/img/mark_white-DC3VjLtV.svg" media="(prefers-color-scheme: dark)"/>
    <title>GuessPicture - a game powered by the GenLayer intelligent contract</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji'; 
        margin: 0; 
        padding: 2rem;
      }
      .wrap { max-width: 800px; margin: 0 auto; }
      h1 { margin: 0 0 1rem; }
      .nav { max-width: 800px; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
      .nav a { color: #0366d6; text-decoration: none; }
      .nav a.active { font-weight: 600; }
      .nav .links { display: flex; gap: .75rem; }
      .nav .wallet { display: flex; gap: .5rem; align-items: center; }
      .game-creation-links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-top: 1.5rem;
      }
      .game-creation-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem 1rem;
        border: 2px solid #0366d6;
        border-radius: 8px;
        text-decoration: none;
        color: inherit;
        transition: all 0.2s ease-in-out;
        text-align: center;
      }
      .game-creation-btn:hover {
        background-color: #e0f2f7;
        border-color: #0056b3;
        cursor: pointer;
      }
      .game-creation-btn-icon {
        display: block;
        width: 100%;
        max-height: 120px;
        object-fit: contain;
        object-position: center;
        margin-bottom: 0.5rem;
      }
      @media (max-width: 420px) {
        .game-creation-links { grid-template-columns: 1fr; }
        .game-creation-btn-icon { width: 80px; height: 80px; }
      }
      .game-creation-btn-title {
        font-weight: 600;
        font-size: 1.2rem;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <div class="links">
        <a href="/" class="active">New Game</a>
        <a href="/mochi">Mochi NFT</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/rules">Rules</a>
      </div>
      <div class="wallet">
        <a href="/me"><span id="addr" style="opacity:.8"></span></a>
        <button id="connectBtn" class="btn">Connect wallet</button>
      </div>
    </div>
    <div class="wrap">
      <h1>Choose a Game to Create</h1>
      <div class="game-creation-links">
        <a href="/guess" class="game-creation-btn">
          <img src="/img/gp.png" class="game-creation-btn-icon"/>
          <span class="game-creation-btn-title">GuessPicture</span>
        </a>
        <a href="/draw-match" class="game-creation-btn">
          <img src="/img/dm.png" class="game-creation-btn-icon"/>
          <span class="game-creation-btn-title">DrawMatch</span>
        </a>
        <a href="/quiz" class="game-creation-btn">
          <img src="/img/aq.png" class="game-creation-btn-icon"/>
          <span class="game-creation-btn-title">AiQuiz</span>
        </a>
        <a href="/punch" class="game-creation-btn">
          <img src="/img/pl.png" class="game-creation-btn-icon"/>
          <span class="game-creation-btn-title">PunchLine</span>
        </a>
        <a href="/cat-beauty" class="game-creation-btn">
          <img src="/img/cb.png" class="game-creation-btn-icon"/>
          <span class="game-creation-btn-title">CatBeauty</span>
        </a>
        <a href="/dog-beauty" class="game-creation-btn">
          <img src="/img/db.jpeg" class="game-creation-btn-icon"/>
          <span class="game-creation-btn-title">DogBeauty</span>
        </a>
        <a href="/cook" class="game-creation-btn">
          <img src="/img/cu.png" class="game-creation-btn-icon"/>
          <span class="game-creation-btn-title">CookItUp</span>
        </a>
        <a href="/mochi-quest" class="game-creation-btn">
          <img src="/img/mq.png" class="game-creation-btn-icon"/>
          <span class="game-creation-btn-title">Mochi: Saving the Consensus</span>
        </a>
        <a href="/questions" class="game-creation-btn">
          <img src="/img/tq.png" class="game-creation-btn-icon"/>
          <span class="game-creation-btn-title">TwentyQuestions</span>
        </a>
        <a href="/" class="game-creation-btn" disabled>
          <span class="game-creation-btn-title">Coming Soon</span>
        </a>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>

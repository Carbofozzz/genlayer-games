<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guess the Picture - a game powered by the GenLayer intelligent contract</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji'; margin: 0; padding: 2rem; }
      .wrap { max-width: 720px; margin: 0 auto; }
      h1 { margin: 0 0 1rem; }
      code { background: #f2f2f2; padding: .2rem .4rem; border-radius: 4px; }
      canvas { touch-action: none; }
      .nav { max-width: 720px; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
      .nav a { color: #0366d6; text-decoration: none; }
      .nav a.active { font-weight: 600; }
      .nav .links { display: flex; gap: .75rem; }
      .nav .wallet { display: flex; gap: .5rem; align-items: center; }
      .btn { padding: .4rem .7rem; border: 1px solid #ccc; border-radius: 6px; background: #f8f8f8; cursor: pointer; }
      .hidden { display: none !important; }
      .row .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #ddd;
        border-top-color: #0366d6;
        border-radius: 50%;
        animation: spin .8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <div class="links">
        <a href="/" class="active">Home</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/rules">Rules</a>
      </div>
      <div class="wallet">
        <a href="/me"><span id="addr" style="opacity:.8"></span></a>
        <button id="connectBtn" class="btn">Connect wallet</button>
      </div>
    </div>
    <div class="wrap">
      <h1>Create a Game</h1>
      <p>Draw with your mouse and start the game.</p>
      <div style="border:1px solid #ddd; border-radius:8px; overflow:hidden; width:100%; max-width:600px;">
        <canvas id="canvas" style="display:block; width:100%; height:300px; background:#fff;"></canvas>
      </div>
      <div class="row" style="margin-top:1rem; display:flex; gap:.5rem; flex-wrap: wrap;">
        <button id="clearBtn">Clear</button>
        <button id="saveBtn">Create game</button>
        <div id="saveProgress" class="spinner hidden" aria-label="Loading"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@5.1.1/dist/signature_pad.umd.min.js"></script>
    <script type="module" src="/wallet.js"></script>
    <script>
      const canvas = document.getElementById('canvas');
      const clearBtn = document.getElementById('clearBtn');
      const submitBtn = document.getElementById('saveBtn');
      const progress = document.getElementById('saveProgress');

      function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * ratio;
        canvas.height = 300 * ratio;
        const ctx = canvas.getContext('2d');
        ctx.scale(ratio, ratio);
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      const signaturePad = new SignaturePad(canvas, { minWidth: 1.5, maxWidth: 3, penColor: 'black' });

      clearBtn.addEventListener('click', async () => {
        signaturePad.clear();
      });

      submitBtn.addEventListener('click', async () => {
        if (signaturePad.isEmpty()) {
          alert('Please draw something first');
          return;
        }
        try {
          if (!WalletUI.isConnected()) throw new Error('Please connect your wallet first');
        } catch (e) { alert(e.message); return; }
        clearBtn.classList.add('hidden');
        submitBtn.classList.add('hidden');
        progress.classList.remove('hidden');
        const dataUrl = signaturePad.toDataURL('image/png');
        try {
          const res = await fetch('/api/signature', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dataUrl })
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Save failed');
          console.log("Picture ", json)
          WalletUI.game(json.gameUrl, json.id, json.url)
        } catch (e) {
          alert(e.message);
          clearBtn.classList.remove('hidden');
          submitBtn.classList.remove('hidden');
          progress.classList.add('hidden');
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leaderboard</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji'; margin: 0; padding: 2rem; }
      .wrap { max-width: 800px; margin: 0 auto; }
      a { color: #0366d6; text-decoration: none; }
      ul { padding-left: 1.25rem; }
      .nav { max-width: 800px; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
      .nav a { color: #0366d6; text-decoration: none; }
      .nav a.active { font-weight: 600; }
      .nav .links { display: flex; gap: .75rem; }
      .nav .wallet { display: flex; gap: .5rem; align-items: center; }
      .btn { padding: .4rem .7rem; border: 1px solid #ccc; border-radius: 6px; background: #f8f8f8; cursor: pointer; }
      .lb-tab { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
      .lb-tab-active { background: #e5efff; border-color: #9cb8ff; font-weight: 600; }
    </style>
  </head>
  <body data-page-name="leaderboard">
    <div class="nav">
      <div class="links">
        <a href="/">New Game</a>
        <a href="/leaderboard" class="active">Leaderboard</a>
        <a href="/rules">Rules</a>
      </div>
      <div class="wallet">
        <a href="/me"><span id="addr" style="opacity:.8"></span></a>
        <button id="connectBtn" class="btn">Connect wallet</button>
      </div>
    </div>
    <div class="wrap">
      <h1>Leaderboard</h1>
      <div id="lbTabs" style="margin: 1rem 0; border-bottom: 1px solid #e5e7eb; display:flex; gap:.75rem;">
        <button class="btn lb-tab lb-tab-active" data-tab="overall">Overall</button>
        <button class="btn lb-tab" data-tab="guess">GuessPicture</button>
        <button class="btn lb-tab" data-tab="match">DrawMatch</button>
        <button class="btn lb-tab" data-tab="punch">PunchLine</button>
      </div>
    
      <div id="leaderboard-overall"></div>
      <div id="leaderboard-guess" style="display:none;"></div>
      <div id="leaderboard-match" style="display:none;"></div>
      <div id="leaderboard-quiz" style="display:none;"></div>
      <div id="leaderboard-punch" style="display:none;"></div>
    </div>
    <script type="module" src="/wallet.js"></script>
  </body>
</html>
